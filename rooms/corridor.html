<a-entity id="corridor-group">

    <!-- CORRIDOR -->
    <a-entity id="corridor-entity" gltf-model="#corridor" position="0 0 0" scale="1 1 1" corridor-textures
        corridor-state corridor-transition>

        <!-- TRIGGERS -->
        <a-box id="trigger-puzzle-1" class="trigger-box" width="3" height="3" depth="0.1" position="5.6 1.5 1.5"
            rotation="0 -90 0" visible="false"></a-box>
        <a-box id="trigger-puzzle-2" class="trigger-box" width="3" height="3" depth="0.1" position="10.5 1.5 0.1"
            rotation="0 0 0" visible="false"></a-box>

        <!-- TWINS -->
        <a-entity id="twin-ghosts" gltf-model="#twins" position="14.5 0 1.5" scale="1 1 1" visible="false"></a-entity>

        <!-- DOORS -->
        <a-entity id="door-1" door="lamp: #wall-lamp-1" door-variants position="6 0 3" rotation="0 180 0"></a-entity>
        <a-entity id="door-2" door="lamp: #wall-lamp-2; isLocked: true" door-variants position="9 0 0"></a-entity>
        <a-entity id="door-3" door="lamp: #wall-lamp-3; isLocked: true" door-variants position="18 0 0"
            rotation="0 -90 0"></a-entity>
        <a-plane id="door-3-cover" width="2" height="3" position="18.11 1 1.5" rotation="0 -90 90"
            color="#000000"></a-plane>

        <!-- CEILING LAMPS -->
        <a-entity class="corridor-lamp" lamp="type: ceiling; variant: normal" position="4.5 3 1.5"></a-entity>
        <a-entity class="corridor-lamp" lamp="type: ceiling; variant: normal" position="9 3 1.5"></a-entity>
        <a-entity class="corridor-lamp" id="twins-lamp" lamp="type: ceiling; variant: normal"
            position="13.5 3 1.5"></a-entity>

        <!-- WALL LAMPS -->
        <a-entity id="wall-lamp-1" lamp="type: wall" position="3.5 1.6 3" rotation="0 180 0"></a-entity>
        <a-entity id="wall-lamp-2" lamp="type: wall" position="9.5 1.6 0"></a-entity>
        <a-entity id="wall-lamp-3" lamp="type: wall" position="18 1.6 0.5" rotation="0 -90 0"></a-entity>

        <a-plane redrum id="redrum" width="2" height="0.523" position="10.5 1.2 2.999" rotation="0 180 20"
            material="transparent: true; opacity: 1; alphaTest: 0.1"></a-plane>
    </a-entity>

    <!-- STATE BUTTONS -->
    <a-entity position="0.05 1.4 0.7" rotation="0 90 0"
        state-button="state: normal; label: Normal; color: #2a4a8a"></a-entity>
    <a-entity position="0.05 1.4 1.5" rotation="0 90 0"
        state-button="state: decayed; label: Decayed; color: #5a3a1a"></a-entity>
    <a-entity position="0.05 1.4 2.3" rotation="0 90 0"
        state-button="state: frosted; label: Frosted; color: #1a5a6a"></a-entity>
    <a-entity position="0.05 1.1 1.5" rotation="0 90 0"
        flicker-button="selector: [lamp]; label: Flicker; color: #4a1a4a"></a-entity>

    <!-- PUZZLE EVENT BUTTONS -->
    <a-entity position="0.05 0.8 1.1" rotation="0 90 0"
        event-button="event: puzzle-1-solved; label: Puzzle 1; color: #1a6a3a"></a-entity>
    <a-entity position="0.05 0.8 1.9" rotation="0 90 0"
        event-button="event: puzzle-2-solved; label: Puzzle 2; color: #6a3a1a"></a-entity>

</a-entity>
