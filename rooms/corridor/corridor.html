<a-entity id="corridor-group">

    <!-- CORRIDOR -->
    <a-entity gltf-model="#corridor" position="0 0 0" scale="1 1 1" corridor-textures corridor-state>

        <!-- TWINS -->
        <a-entity gltf-model="#twins" position="16.5 0 1.5" scale="1 1 1"></a-entity>

        <!-- DOORS -->
        <a-entity id="door-1" door="lamp: #wall-lamp-1" position="6 0 3" rotation="0 180 0"></a-entity>
        <a-entity id="door-2" door="lamp: #wall-lamp-2" position="9 0 0"></a-entity>
        <a-entity id="door-3" door="lamp: #wall-lamp-3" position="18 0 0" rotation="0 -90 0"></a-entity>

        <!-- CEILING LAMPS -->
        <a-entity lamp="type: ceiling; variant: normal" position="4.5 3 1.5"></a-entity>
        <a-entity lamp="type: ceiling; variant: normal" position="9 3 1.5"></a-entity>
        <a-entity lamp="type: ceiling; variant: normal" position="13.5 3 1.5"></a-entity>

        <!-- WALL LAMPS -->
        <a-entity id="wall-lamp-1" lamp="type: wall" position="3.5 1.6 3" rotation="0 180 0"></a-entity>
        <a-entity id="wall-lamp-2" lamp="type: wall" position="9.5 1.6 0"></a-entity>
        <a-entity id="wall-lamp-3" lamp="type: wall" position="18 1.6 0.5" rotation="0 -90 0"></a-entity>

        <!-- <a-box class="collision" position="3 1 1.5" width="2" height="2" depth="0.2" rotation="0 90 0"></a-box> -->

    </a-entity>

</a-entity>
