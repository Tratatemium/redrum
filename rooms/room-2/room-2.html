<a-entity id="room-2-group">

    <!-- CEILING LAMPS -->
    <!-- <a-entity lamp="type: ceiling; variant: normal" position="-2 3 2"></a-entity>
    <a-entity lamp="type: ceiling; variant: normal" position="2 3 -2"></a-entity>
    <a-entity lamp="type: ceiling; variant: normal" position="2 3 2"></a-entity>
    <a-entity lamp="type: ceiling; variant: normal" position="-2 3 -2"></a-entity> -->

    <a-entity id="floor-lamp"
        light="type: spot; color: #feffa8; intensity: 5; castShadow: true; angle: 50; penumbra: 0.4; distance: 8; decay: 2; shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.001"
        position="0.678 1.4 4" rotation="-90 0 0"></a-entity>
    <a-entity id="desk-lamp"
        light="type: spot; color: #feffa8; intensity: 0.25; castShadow: true; angle: 70; penumbra: 0.4; distance: 0.5; decay: 2; shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.001"
        position="-4.2 1 1.25" rotation="-80 3.3 24"></a-entity>

    <!-- STATUE -->

    <a-entity id="statue" target="#statue" position="0 -0.9 0" rotation="0 0 0"
        sound="src: #heres-johnny; positional: true">
        <a-entity id="statue-lamp" lamp="type: chandelier; variant: red" position="0 1.5 0"></a-entity>
        <a-gltf-model position="0 0.9 0" src="#statue-head" rotate-on-click="target: 90; sound: #stone2"
            class="collision clickable puzzle-piece" rotation="0 180 0"
            shadow="cast: true; receive: true"></a-gltf-model>
        <a-gltf-model position="0 0.9 0" src="#statue-torso" rotate-on-click="target: 90; sound: #stone1"
            class="collision clickable puzzle-piece" rotation="0 -90 0"
            shadow="cast: true; receive: true"></a-gltf-model>
        <a-gltf-model position="0 0.9 0" src="#statue-legs" rotate-on-click="target: 90; sound: #stone2"
            class="collision clickable puzzle-piece" rotation="0 135 0"
            shadow="cast: true; receive: true"></a-gltf-model>
        <a-gltf-model position="0 0.9 0" src="#statue-bottom" class="collision" rotation="0 90 0"
            shadow="cast: true; receive: true"></a-gltf-model>
    </a-entity>

    <a-gltf-model id="room-2-entity" position="0 0 0" src="#room-2" shadow="receive: true"></a-gltf-model>
</a-entity>

<script type="module" src="./rooms/room-2/puzzle.js"></script>
