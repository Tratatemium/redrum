<a-entity id="room-2-group">

    <!-- CEILING LAMPS -->
    <a-entity lamp="type: ceiling; variant: normal" position="2.5 3 1.5"></a-entity>
    <a-entity lamp="type: ceiling; variant: normal" position="8 3 1.5"></a-entity>
    <a-entity lamp="type: ceiling; variant: normal" position="2.5 3 5"></a-entity>
    <a-entity lamp="type: ceiling; variant: normal" position="8 3 5"></a-entity>
    <a-entity id="statue-lamp" lamp="type: ceiling; variant: red" position="4.5 3 2.5"></a-entity>

    <!-- STATUE -->

    <a-entity id="statue" position="4.5 0 2.5" rotation="0 180 0">
        <a-gltf-model position="0 0.9 0" src="#statue-head" sound="src: #stone2; on: click" rotate-on-click="target: 0" class="collision clickable puzzle-piece" rotation="0 45 0"></a-gltf-model>
        <a-gltf-model position="0 0.9 0" src="#statue-torso" sound="src: #stone1; on: click" rotate-on-click="target: 0" class="collision clickable puzzle-piece" rotation="0 67.5 0"></a-gltf-model>
        <a-gltf-model position="0 0.9 0" src="#statue-legs" sound="src: #stone2; on: click" rotate-on-click="target: 0" class="collision clickable puzzle-piece" rotation="0 90 0"></a-gltf-model>
    </a-entity>


    <a-gltf-model position="0 0 0" src="#room-2"></a-gltf-model>
</a-entity>

<script type="module" src="./rooms/room-2/puzzle.js"></script>
