<html>

<head>
  <script type="module" src="./src/main.js"></script>
</head>

<body>
  <a-scene renderer="shadowMap: true; shadowMapType: pcfsoft" loading>

    <a-assets id="assets">
      <a-asset-item id="navmesh" src="/models/Navmesh.glb"></a-asset-item>

      <a-asset-item id="lamp-ceiling" src="/models/Lamp_Ceiling.glb"></a-asset-item>
      <a-asset-item id="lamp-wall" src="/models/Lamp_Wall.glb"></a-asset-item>
      <a-asset-item id="lamp-chandelier" src="/models/Lamp_Chandelier.glb"></a-asset-item>
      <a-asset-item id="door" src="/models/corridor/Door.glb"></a-asset-item>
      <a-asset-item id="twins" src="/models/corridor/Twins.glb"></a-asset-item>

      <a-asset-item id="statue-head" src="/models/room-2/statue-head.glb"></a-asset-item>
      <a-asset-item id="statue-legs" src="/models/room-2/statue-legs.glb"></a-asset-item>
      <a-asset-item id="statue-torso" src="/models/room-2/statue-torso.glb"></a-asset-item>
      <a-asset-item id="statue-bottom" src="/models/room-2/statue-bottom.glb"></a-asset-item>

      <a-asset-item id="room1-lamp" src="/rooms/room-1/assets/lamp.glb"></a-asset-item>
      <a-asset-item id="room1-furniture" src="/rooms/room-1/assets/furniture.glb"></a-asset-item>
      <a-asset-item id="room1-showcase" src="/rooms/room-1/assets/showcase.glb"></a-asset-item>
      <a-asset-item id="room1-axe" src="/rooms/room-1/assets/axe.glb"></a-asset-item>
      <a-asset-item id="room1-bed" src="/rooms/room-1/assets/hospital_bed.glb"></a-asset-item>
      <a-asset-item id="room1-ghost" src="/rooms/room-1/assets/ghost.glb"></a-asset-item>
      <a-asset-item id="room1-char" src="/rooms/room-1/assets/char.glb"></a-asset-item>
      <a-asset-item id="room1-cabinet" src="/rooms/room-1/assets/cabinet.glb"></a-asset-item>
      <a-asset-item id="room1-candle" src="/rooms/room-1/assets/candle.glb"></a-asset-item>
      <a-asset-item id="room1-chair" src="/rooms/room-1/assets/chair.glb"></a-asset-item>
      <a-asset-item id="room1-table" src="/rooms/room-1/assets/small-table.glb"></a-asset-item>
      <a-asset-item id="room1-ladder" src="/rooms/room-1/assets/ladder.glb"></a-asset-item>
      <a-asset-item id="room1-testrugg" src="/rooms/room-1/assets/testrugg.glb"></a-asset-item>
      <a-asset-item id="room1-candles" src="/rooms/room-1/assets/candles_set.glb"></a-asset-item>
      <a-asset-item id="room1-ivy" src="/rooms/room-1/assets/ivy.glb"></a-asset-item>
      <a-asset-item id="room1-branches" src="/rooms/room-1/assets/branches.glb"></a-asset-item>
      <a-asset-item id="room1-stains" src="/rooms/room-1/assets/stains.glb"></a-asset-item>
      <a-asset-item id="room1-ink" src="/rooms/room-1/assets/ink.glb"></a-asset-item>
      <a-asset-item id="room1-ink2" src="/rooms/room-1/assets/ink2.glb"></a-asset-item>
      <a-asset-item id="room1-brick1" src="/rooms/room-1/assets/brick1.glb"></a-asset-item>
      <a-asset-item id="room1-brick2" src="/rooms/room-1/assets/brick2.glb"></a-asset-item>
      <a-asset-item id="room1-brick3" src="/rooms/room-1/assets/brick3.glb"></a-asset-item>
      <a-asset-item id="room1-oldtable" src="/rooms/room-1/assets/oldTable.glb"></a-asset-item>
      <a-asset-item id="room1-vintage-lamp" src="/rooms/room-1/assets/vintage_lamp.glb"></a-asset-item>

      <a-asset-item id="corridor" src="/models/corridor/Corridor_01.glb"></a-asset-item>
      <a-asset-item id="room1" src="/rooms/room-1/assets/room-test.glb"></a-asset-item>
      <a-asset-item id="room-2" src="/models/room-2/room.glb"></a-asset-item>
      <a-asset-item id="maze" src="/models/maze/Maze.glb"></a-asset-item>
      <a-asset-item id="overlook-hotel" src="/models/maze/Overlook_hotel.glb"></a-asset-item>

      <audio id="door-open" src="/audio/door/door_open.mp3" preload="auto"></audio>
      <audio id="door-close" src="/audio/door/door_close.mp3" preload="auto"></audio>
      <audio id="door-locked" src="/audio/door/door_locked.mp3" preload="auto"></audio>
      <audio id="stone1" src="/audio/stone/stone1.mp3" preload="auto"></audio>
      <audio id="stone2" src="/audio/stone/stone2.mp3" preload="auto"></audio>
      <audio id="stone3" src="/audio/stone/turn.mp3" preload="auto"></audio>
      <audio id="electrical" src="/audio/transition/broken_electrical.mp3" preload="auto"></audio>
      <audio id="drop-to-dark" src="/audio/transition/drop_to_dark.mp3" preload="auto"></audio>
      <audio id="reverse-breath" src="/audio/transition/reverse_breath.mp3" preload="auto"></audio>
      <audio id="freezing" src="/audio/transition/freezing.mp3" preload="auto"></audio>
      <audio id="bg-audio" src="/audio/bg-audio.mp3" preload="auto"></audio>
      <audio id="heres-johnny" src="/audio/statue/heres-johnny.mp3" preload="auto"></audio>
      <audio id="footsteps" src="/audio/footsteps.mp3" loop preload="auto"></audio>
      <audio id="footsteps-normal" src="/audio/footsteps/footsteps_normal.mp3" loop preload="auto"></audio>
      <audio id="footsteps-snow" src="/audio/footsteps/footsteps_snow.mp3" loop preload="auto"></audio>
      <audio id="char2-sound" src="/rooms/room-1/assets/char2long.mp3" loop preload="auto"></audio>

      <img id="sky" src="sky_01.png">
      <img id="loading-screen" src="loading.png">
    </a-assets>

    <!-- PLAYER -->
    <a-entity id="player-rig" position="1 0 1.5" rotation="0 -90 0"
      movement-controls="constrainToNavMesh: true; enabled: false" footstep-sounds scene-trigger>
      <a-entity camera look-controls position="0 1.6 0" player-collision>
        <a-cursor raycaster="objects: .clickable" cursor="rayOrigin: mouse; fuse: false"></a-cursor>
        <a-plane id="player-screen" position="0 0 -0.5" width="2" height="2"
          player-screen="color: #ffffff; opacity: 1; src: #loading-screen">
        </a-plane>
      </a-entity>
    </a-entity>

    <include file="./audio.html"></include>

    <!-- NAVMESH -->
    <a-entity id="navmesh-entity" gltf-model="#navmesh" position="0 -0.001 0" nav-mesh></a-entity>

    <!-- LIGHT -->
    <a-light type="ambient" color="#ddcea7" intensity="0.05" room-2-light></a-light>

    <!-- SKY -->
    <a-sky src="#sky"></a-sky>

    <!-- ROOMS -->
    <a-entity id="corridor-anchor" position="0 0 0">
      <include file="./rooms/corridor/corridor.html"></include>
    </a-entity>
    <a-entity id="room-1-anchor" position="8 0 -4.760" rotation="0 180 0">
      <include file="./rooms/room-1/room-1.html"></include>
    </a-entity>
    <a-entity id="room-2-anchor" position="4.524 0 7.6" rotation="0 90 0">
      <include file="./rooms/room-2/room-2.html"></include>
    </a-entity>
    <a-entity id="maze-anchor" position="18.099 0 0">
      <include file="./rooms/maze/maze.html"></include>
    </a-entity>

  </a-scene>
</body>

</html>
